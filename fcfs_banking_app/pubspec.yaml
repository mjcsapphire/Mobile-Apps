name: fcfs_banking_app
description: "A new Flutter project."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: "none" # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.8
  #UI
  sizer: ^3.0.4
  smooth_page_indicator: ^1.2.0+3
  vibration: ^1.8.4
  shared_preferences: ^2.3.2
  fluttertoast: ^8.2.8
  image_picker: ^1.1.2
  # slider_button: ^2.1.0
  local_auth: ^2.3.0
  action_slider: ^0.7.0
  #state management
  get: ^4.6.6
  go_router: ^14.3.0

  #firebase 
  firebase_core: ^3.12.0
  firebase_storage: ^12.4.3
  firebase_auth: ^5.5.0
  firebase_messaging: ^15.2.3
  # firebase_analytics: ^11.3.3
  firebase_crashlytics: ^4.3.3
  cloud_firestore: ^5.6.4

  mobile_scanner: 6.0.6
  fl_chart: ^0.69.0
  timeago: ^3.7.0
  intl:
  qr_flutter: ^4.1.0
  # mobile_scanner: ^6.0.6
  permission_handler: ^11.3.1
  dartz: ^0.10.1
  cached_network_image: ^3.4.1
  logger: ^2.4.0
  flutter_dotenv: ^5.0.2

  pdf: ^3.10.0
  printing: ^5.10.0
  path_provider: ^2.0.15
  open_file: ^3.5.9
  shimmer: ^3.0.0
  googleapis_auth: ^1.6.0
  http: ^1.2.2
  flutter_local_notifications: ^18.0.1
  dio: ^5.7.0
  carousel_slider: ^5.0.0
  file_picker: ^9.0.0
  get_storage: ^2.1.1
  flutter_contacts: ^1.1.9+2
  flutter_slidable: ^3.1.2
  gradient_borders: ^1.0.1
  # universal_file_viewer: ^0.0.5


dev_dependencies:
  flutter_test:
    sdk: flutter

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.
  flutter_lints: ^4.0.0

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:
  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  # To add assets to your application, add an assets section, like this:
  assets:
    - assets/images/
    - assets/icons/
    - assets/icons/card/
    - assets/
    - .env.production
    - .env.development
  #   - images/a_dot_ham.jpeg

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  fonts:
    - family: Roboto
      fonts:
        - asset: assets/fonts/Roboto-Black.ttf
        - asset: assets/fonts/Roboto-Bold.ttf
        - asset: assets/fonts/Roboto-Light.ttf
        - asset: assets/fonts/Roboto-Medium.ttf
        - asset: assets/fonts/Roboto-Regular.ttf
        - asset: assets/fonts/Roboto-Thin.ttf
    - family: AnonymousPro
      fonts:
        - asset: assets/fonts/AnonymousPro/AnonymousPro-Bold.ttf
        - asset: assets/fonts/AnonymousPro/AnonymousPro-Regular.ttf
    - family: RobotoMono
      fonts:
        - asset: assets/fonts/RobotoMono/RobotoMono-Bold.ttf
        - asset: assets/fonts/RobotoMono/RobotoMono-Regular.ttf
        - asset: assets/fonts/RobotoMono/RobotoMono-Thin.ttf
    - family: Montserrat
      fonts:
        - asset: assets/fonts/Montserrat/Montserrat-Bold.ttf
        - asset: assets/fonts/Montserrat/Montserrat-SemiBold.ttf
        - asset: assets/fonts/Montserrat/Montserrat-Regular.ttf
        - asset: assets/fonts/Montserrat/Montserrat-Thin.ttf

  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/to/font-from-package
